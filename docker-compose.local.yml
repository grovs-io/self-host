# Local trial on one machine, no TLS: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# lvh.me and its subdomains resolve to 127.0.0.1, so the hosts in .env work without DNS.
services:
  web:
    ports:
      - "${GROVS_WEB_PORT:-80}:3000"
  dashboard:
    ports:
      - "${GROVS_DASHBOARD_PORT:-3002}:3000"
    # The dashboard calls the API server-side; inside the container lvh.me would be its own loopback.
    extra_hosts:
      - "api.lvh.me:host-gateway"
