{
  "captainVersion": 4,
  "services": {
    "$$cap_appname-postgres": {
      "image": "postgres:16.10-alpine",
      "environment": {
        "POSTGRES_DB": "grovs_production",
        "POSTGRES_USER": "grovs",
        "POSTGRES_PASSWORD": "$$cap_POSTGRES_PASSWORD"
      },
      "caproverExtra": {
        "notExposeAsWebApp": "true"
      },
      "volumes": [
        "$$cap_appname-postgres-data:/var/lib/postgresql/data"
      ]
    },
    "$$cap_appname-redis": {
      "image": "redis:7.4.5-alpine",
      "environment": {},
      "caproverExtra": {
        "notExposeAsWebApp": "true"
      },
      "volumes": [
        "$$cap_appname-redis-data:/data"
      ],
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "$$cap_REDIS_PASSWORD"
      ]
    },
    "$$cap_appname-clickhouse": {
      "image": "clickhouse/clickhouse-server:25.3.6.56",
      "environment": {
        "CLICKHOUSE_DB": "grovs_production",
        "CLICKHOUSE_USER": "grovs",
        "CLICKHOUSE_PASSWORD": "$$cap_CLICKHOUSE_PASSWORD"
      },
      "caproverExtra": {
        "notExposeAsWebApp": "true"
      },
      "volumes": [
        "$$cap_appname-clickhouse-data:/var/lib/clickhouse"
      ]
    },
    "$$cap_appname-web": {
      "image": "ghcr.io/grovs-io/backend:2.3.1",
      "environment": {
        "SERVER_HOST_PROTOCOL": "https://",
        "REACT_HOST_PROTOCOL": "https://",
        "POSTGRES_USER": "grovs",
        "POSTGRES_DB": "grovs_production",
        "POSTGRES_MAX_CONNECTIONS": "200",
        "CLICKHOUSE_WRITE_ENABLED": "true",
        "CLICKHOUSE_READ_ENABLED": "true",
        "CLICKHOUSE_PRIMARY": "true",
        "CLICKHOUSE_ANALYTICS_ROLLUPS_READ_ENABLED": "true",
