x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: grovs_production
      CLICKHOUSE_USER: grovs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot during initial deployment: migrate PostgreSQL and ClickHouse, seed the OAuth app + admin.
  migrate:
    <<: *backend
    restart: "no"
    command: ["bash", "-c", "bin/rails db:prepare && bin/rails db:seed && bin/rails clickhouse:setup"]
    depends_on: *backend-depends

  web:
    networks: [default, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${GROVS_PROXY_NETWORK:?Set the platform proxy network}"
      - "traefik.http.services.${GROVS_ROUTER_PREFIX:-grovs}-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.rule=Host(`${API_HOST}`) || Host(`${SDK_HOST}`) || Host(`${MCP_HOST}`) || Host(`${GO_HOST}`) || Host(`${LINKS_PROD_HOST}`) || Host(`${LINKS_TEST_HOST}`) || Host(`${PREVIEW_HOST}`) || HostRegexp(`^[a-z0-9-]+[.]${GROVS_LINKS_DOMAIN_PATTERN:?Run scripts/prepare-platform.sh}$$`) || HostRegexp(`^[a-z0-9-]+[.]${GROVS_TEST_DOMAIN_PATTERN:?Run scripts/prepare-platform.sh}$$`)"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.priority=10"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.service=${GROVS_ROUTER_PREFIX:-grovs}-web"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.entrypoints=${GROVS_HTTPS_ENTRYPOINT:?Set the HTTPS entrypoint}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls=true"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.certresolver=${GROVS_CERT_RESOLVER:?Set a DNS challenge resolver}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web-http.rule=Host(`${API_HOST}`) || Host(`${SDK_HOST}`) || Host(`${MCP_HOST}`) || Host(`${GO_HOST}`) || Host(`${LINKS_PROD_HOST}`) || Host(`${LINKS_TEST_HOST}`) || Host(`${PREVIEW_HOST}`) || HostRegexp(`^[a-z0-9-]+[.]${GROVS_LINKS_DOMAIN_PATTERN:?Run scripts/prepare-platform.sh}$$`) || HostRegexp(`^[a-z0-9-]+[.]${GROVS_TEST_DOMAIN_PATTERN:?Run scripts/prepare-platform.sh}$$`)"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web-http.priority=10"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web-http.entrypoints=${GROVS_HTTP_ENTRYPOINT:?Set the HTTP entrypoint}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web-http.service=${GROVS_ROUTER_PREFIX:-grovs}-web"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web-http.middlewares=${GROVS_ROUTER_PREFIX:-grovs}-web-https"
      - "traefik.http.middlewares.${GROVS_ROUTER_PREFIX:-grovs}-web-https.redirectscheme.scheme=https"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[0].main=${SERVER_HOST}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[0].sans=*.${SERVER_HOST}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[1].main=${DOMAIN_LIVE}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[1].sans=*.${DOMAIN_LIVE}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[2].main=${DOMAIN_TEST}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-web.tls.domains[2].sans=*.${DOMAIN_TEST}"
    <<: *backend
    command: ["bundle", "exec", "puma", "-b", "tcp://0.0.0.0:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Scheduler + events + batch. Singleton: never run more than one replica.
  worker-1:
    <<: *backend
    command:
      - bash
      - -c
      - |
        bundle exec sidekiq -C config/sidekiq_scheduler.yml &
        bundle exec sidekiq -C config/sidekiq_worker.yml &
        bundle exec sidekiq -C config/sidekiq_batch.yml &
        wait -n
    depends_on:
      web:
        condition: service_healthy

  # Maintenance + device updates.
  worker-2:
    <<: *backend
    command:
      - bash
      - -c
      - |
        bundle exec sidekiq -C config/sidekiq_maintenance.yml &
        bundle exec sidekiq -C config/sidekiq_device_updates.yml &
        wait -n
    depends_on:
      web:
        condition: service_healthy

  dashboard:
    networks: [default, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${GROVS_PROXY_NETWORK:?Set the platform proxy network}"
      - "traefik.http.services.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.loadbalancer.server.port=3000"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.rule=Host(`${DASHBOARD_HOST}`)"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.priority=100"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.service=${GROVS_ROUTER_PREFIX:-grovs}-dashboard"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.entrypoints=${GROVS_HTTPS_ENTRYPOINT:?Set the HTTPS entrypoint}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.tls=true"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard.tls.certresolver=${GROVS_CERT_RESOLVER:?Set a DNS challenge resolver}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-http.rule=Host(`${DASHBOARD_HOST}`)"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-http.priority=100"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-http.entrypoints=${GROVS_HTTP_ENTRYPOINT:?Set the HTTP entrypoint}"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-http.service=${GROVS_ROUTER_PREFIX:-grovs}-dashboard"
      - "traefik.http.routers.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-http.middlewares=${GROVS_ROUTER_PREFIX:-grovs}-dashboard-https"
      - "traefik.http.middlewares.${GROVS_ROUTER_PREFIX:-grovs}-dashboard-https.redirectscheme.scheme=https"
    image: ghcr.io/grovs-io/dashboard:${GROVS_VERSION:?Select a published Grovs release}
    restart: unless-stopped
    environment:
      API_URL: ${SERVER_HOST_PROTOCOL:-https://}${API_HOST}
      OAUTH_CLIENT_UID: ${OAUTH_CLIENT_UID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
    depends_on:
      web:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  clickhouse_data:
  storage:

networks:
  default:
  proxy:
    external: true
    name: ${GROVS_PROXY_NETWORK:?Set the platform proxy network}
