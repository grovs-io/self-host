# Grovs self-hosted stack; --profile standalone adds the Caddy proxy with automatic TLS.

x-backend: &backend
  image: ghcr.io/grovs-io/backend:${GROVS_VERSION:-latest}
  env_file: .env
  environment:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    GROVS_SELF_HOSTED: "true"
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CLICKHOUSE_URL: http://grovs:${CLICKHOUSE_PASSWORD}@clickhouse:8123
    CLICKHOUSE_DATABASE: grovs_production
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
  volumes:
    - storage:/app/storage
  restart: unless-stopped

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  # Reverse proxy + Let's Encrypt. Skip the profile on platforms with their own proxy.
  proxy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: grovs_production
      CLICKHOUSE_USER: grovs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot on every start: migrate PostgreSQL and ClickHouse, seed the OAuth app + admin.
  migrate:
    <<: *backend
    restart: "no"
    command: ["bash", "-c", "bin/rails db:prepare && bin/rails db:seed && bin/rails clickhouse:setup"]
    depends_on: *backend-depends

  web:
    <<: *backend
    command: ["bundle", "exec", "puma", "-b", "tcp://0.0.0.0:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Scheduler + events + batch. Singleton: never run more than one replica.
  worker-1:
    <<: *backend
    command:
      - bash
      - -c
      - |
        bundle exec sidekiq -C config/sidekiq_scheduler.yml &
        bundle exec sidekiq -C config/sidekiq_worker.yml &
        bundle exec sidekiq -C config/sidekiq_batch.yml &
        wait -n
    depends_on:
      web:
        condition: service_healthy

  # Maintenance + device updates.
  worker-2:
    <<: *backend
    command:
      - bash
      - -c
      - |
        bundle exec sidekiq -C config/sidekiq_maintenance.yml &
        bundle exec sidekiq -C config/sidekiq_device_updates.yml &
        wait -n
    depends_on:
      web:
        condition: service_healthy

  dashboard:
    image: ghcr.io/grovs-io/dashboard:${GROVS_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_URL: ${SERVER_HOST_PROTOCOL:-https://}${API_HOST}
      OAUTH_CLIENT_UID: ${OAUTH_CLIENT_UID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
    depends_on:
      web:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  clickhouse_data:
  storage:
  caddy_data:
  caddy_config:
