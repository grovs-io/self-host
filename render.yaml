{
  "services": [
    {
      "name": "grovs-clickhouse",
      "type": "pserv",
      "runtime": "image",
      "image": {
        "url": "clickhouse/clickhouse-server:25.3"
      },
      "plan": "2c-4g",
      "region": "frankfurt",
      "autoDeployTrigger": "off",
      "disk": {
        "name": "clickhouse-data",
        "mountPath": "/var/lib/clickhouse",
        "sizeGB": 50
      },
      "envVars": [
        {
          "key": "CLICKHOUSE_RUN_AS_ROOT",
          "value": "1"
        },
        {
          "key": "CLICKHOUSE_USER",
          "value": "grovs"
        },
        {
          "key": "CLICKHOUSE_PASSWORD",
          "generateValue": true
        }
      ]
    },
    {
      "name": "grovs-redis",
      "type": "keyvalue",
      "plan": "1g",
      "region": "frankfurt",
      "ipAllowList": [],
      "maxmemoryPolicy": "noeviction"
    },
    {
      "name": "grovs-web",
      "type": "web",
      "runtime": "image",
      "image": {
        "url": "ghcr.io/grovs-io/backend:2.3.1"
      },
      "plan": "1c-2g",
      "region": "frankfurt",
      "numInstances": 1,
      "autoDeployTrigger": "off",
      "dockerCommand": "bash -c 'echo  | base64 -d > /tmp/grovs.sh && exec bash -e /tmp/grovs.sh'",
      "envVars": [
        {
          "key": "CLICKHOUSE_WRITE_ENABLED",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_READ_ENABLED",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_PRIMARY",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_ANALYTICS_ROLLUPS_READ_ENABLED",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_ATTRIBUTION_READ_ENABLED",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_LINK_DIMENSIONS_READ_ENABLED",
          "value": "true"
        },
        {
          "key": "REVENUE_READS_FROM_LEDGER",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_ROLLUP_FAST_LANE",
          "value": "true"
        },
        {
          "key": "DASHBOARD_CACHE_TTL_SECONDS",
          "value": "60"
        },
        {
          "key": "PG_SHADOW_WRITES",
          "value": "false"
        },
        {
          "key": "WEB_CONCURRENCY",
          "value": "2"
        },
        {
          "key": "RAILS_MAX_THREADS",
          "value": "5"
        },
        {
          "key": "RAILS_DB_POOL",
          "value": "10"
        },
        {
          "key": "SIDEKIQ_EVENTS_CONCURRENCY",
          "value": "10"
        },
        {
          "key": "SECRET_KEY_BASE",
          "generateValue": true
        },
        {
          "key": "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY",
          "generateValue": true
        },
        {
          "key": "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY",
          "generateValue": true
        },
        {
          "key": "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT",
          "generateValue": true
        },
        {
          "key": "ADMIN_API_KEY",
          "generateValue": true
        },
        {
          "key": "DIAGNOSTICS_API_KEY",
          "generateValue": true
        },
        {
          "key": "SENT_QUOTAS_WEBHOOK_KEY",
          "generateValue": true
        },
