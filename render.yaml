xport CLICKHOUSE_URL=\"http://grovs:$ENCODED_PASSWORD@$CLICKHOUSE_HOST:8123\"\nfi\n\nwait_for_http() {\n  local attempt\n  for ((attempt=0; attempt<120; attempt++)); do\n    if curl --fail --silent --max-time 5 \"$1\" >/dev/null; then return 0; fi\n    sleep 5\n  done\n  echo \"Dependency did not become healthy within the startup window.\" >&2\n  return 1\n}\n\nexec bundle exec puma -b \"tcp://0.0.0.0:${PORT:-3000}\"'",
