          "generateValue": true
        },
        {
          "key": "OAUTH_CLIENT_SECRET",
          "generateValue": true
        },
        {
          "key": "BOOTSTRAP_ADMIN_PASSWORD",
          "generateValue": true
        },
        {
          "key": "DEFAULT_LOGO_URL",
