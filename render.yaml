        },
        {
          "key": "DEFAULT_SOCIAL_PREVIEW_URL",
          "value": "https://appssemble-assets.s3.eu-north-1.amazonaws.com/linksquared/social-media-placeholder.jpg"
        },
        {
          "key": "DEFAULT_LINK_TITLE",
          "value": "grovs"
        },
        {
          "key": "DEFAULT_LINK_SUBTITLE",
          "value": "Dynamic links, attributions, and referrals across mobile and web platforms."
        },
        {
          "key": "MAILER_DELIVERY_METHOD",
          "value": ""
        },
        {
          "key": "SMTP_ADDRESS",
          "value": "smtp.example.com"
        },
        {
          "key": "SMTP_PORT",
          "value": "587"
        },
        {
          "key": "SMTP_USERNAME",
          "value": ""
        },
        {
          "key": "SMTP_PASSWORD",
          "value": ""
        },
        {
          "key": "SMTP_AUTHENTICATION",
          "value": "plain"
        },
        {
          "key": "SMTP_ENABLE_STARTTLS_AUTO",
          "value": "true"
        },
        {
          "key": "SERVER_HOST",
          "sync": false
        },
        {
          "key": "DOMAIN_LIVE",
          "sync": false
        },
        {
          "key": "DOMAIN_TEST",
          "sync": false
        },
        {
          "key": "BOOTSTRAP_ADMIN_EMAIL",
          "sync": false
        },
        {
          "key": "AWS_S3_KEY_ID",
          "sync": false
        },
        {
          "key": "AWS_S3_ACCESS_KEY",
          "sync": false
        },
        {
          "key": "AWS_S3_REGION",
          "sync": false
        },
        {
          "key": "AWS_S3_BUCKET",
          "sync": false
        },
        {
          "key": "ACTIVE_STORAGE_SERVICE",
          "value": "amazon"
        },
        {
          "key": "GROVS_EE",
          "value": "false"
        },
        {
          "key": "GROVS_SELF_HOSTED",
          "value": "true"
        },
        {
          "key": "RAILS_ENV",
          "value": "production"
        },
        {
          "key": "RAILS_LOG_TO_STDOUT",
          "value": "true"
        },
        {
          "key": "RAILS_SERVE_STATIC_FILES",
          "value": "true"
        },
        {
          "key": "CLICKHOUSE_DATABASE",
          "value": "grovs_production"
        },
        {
          "key": "PORT",
          "value": "3000"
        },
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "grovs-postgres",
            "property": "connectionString"
          }
        },
        {
          "key": "REDIS_URL",
          "fromService": {
            "name": "grovs-redis",
            "type": "keyvalue",
            "property": "connectionString"
          }
        },
        {
          "key": "CLICKHOUSE_HOST",
          "fromService": {
            "name": "grovs-clickhouse",
            "type": "pserv",
            "property": "host"
          }
        },
        {
          "key": "CLICKHOUSE_PASSWORD",
          "fromService": {
            "name": "grovs-clickhouse",
            "type": "pserv",
            "envVarKey": "CLICKHOUSE_PASSWORD"
          }
        }
      ],
      "healthCheckPath": "/up",
      "preDeployCommand": "bash -c 'echo  | base64 -d > /tmp/grovs.sh && exec bash -e /tmp/grovs.sh'"
    },
